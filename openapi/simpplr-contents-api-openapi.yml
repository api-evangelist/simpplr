openapi: 3.2.0
info:
  title: Simpplr Contents API
  version: '1.0'
  description: 'Operations tagged Contents across 3 of this provider''s published API definitions: simpplr-api-gateway-openapi.yml, simpplr-api-gw-file-upload-openapi.yml, simpplr-staging-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.ec.simpplr.com/api
security:
- sec0: []
tags:
- name: Contents
paths:
  /contents:
    get:
      summary: Search for Contents
      description: Use this API to search for Contents.
      operationId: search-for-contents
      parameters:
      - name: size
        in: query
        description: Maximum number of results to return
        schema:
          type: integer
          format: int32
          default: 16
      - name: filter
        in: query
        description: Filter to apply to results
        schema:
          type: string
          enum:
          - updates
          - popular
          - latest
          - all
          - managing
          - owned
          - author
          default: updates
      - name: sort-by
        in: query
        description: Technique to sort the results by
        schema:
          type: string
          enum:
          - alphabetical
          - createdNewest
          - createdOldest
          - publishedNewest
          - publishedOldest
          - modifiedNewest
          - modifiedOldest
          default: alphabetical
      - name: site-id
        in: query
        description: ID of a Site that resulting Content must belong to
        schema:
          type: string
          default: a1A5e000001wQdXEAU
      - name: people-id
        in: query
        description: Id of the people
        schema:
          type: string
      - name: status
        in: query
        description: What should be the current status of the content
        schema:
          type: string
          enum:
          - draft
          - all
          - pending
          - published
          - unpublished
          - rejected
          - validationRequired
          - validationExpired
          default: published
      - name: content-sub-type
        in: query
        schema:
          type: string
          enum:
          - news
          - knowledge
          - all
          default: news
      - name: is-must-read
        in: query
        description: Is the content must read
        schema:
          type: boolean
          default: false
      - name: category
        in: query
        description: Which category the content belongs to
        schema:
          type: string
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: content type
        schema:
          type: string
          enum:
          - album
          - page
          - event
          - blogpost
      responses:
        '200':
          description: '200'
          content:
