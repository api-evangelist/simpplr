  /contents/page-categories:
    post:
      summary: Search for Page Categories
      description: This search API is used to retrieve all page categories based on the specified 'site-id' and 'sort- by' (either 'createdNewest' or 'createdOldest') provided in the request body. Additionally, we have an additional parameter, 'term' which contains the name of the page category
      operationId: search-page-categories
