            schema:
              type: object
              properties:
                size:
                  type: integer
                  description: Maximum number of results to return
                  default: 16
                  format: int32
                sort-by:
                  type: string
                  description: Technique to sort the results by
                  default: createdNewest
                  enum:
                  - createdNewest
                  - createdOldest
