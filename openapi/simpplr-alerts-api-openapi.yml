    get:
      summary: Search for Alerts
      description: Use this API to search for Alerts.
      operationId: search-for-alerts
      parameters:
      - name: size
        in: query
        description: Page size
        schema:
          type: integer
          format: int32
          default: 10
      - name: filter
        in: query
        description: How to filter Alerts
        schema:
          type: string
          enum:
          - all
          - active
          - expired
          - scheduled
          default: all
      - name: sort-by
        in: query
        description: Sorting order for Alerts
        schema:
          type: string
          enum:
          - createdNewest
          - createdOldest
          - displayFromNewest
          - displayFromOldest
          - displayToNewest
          - displayToOldest
          default: createdNewest
      - name: recipient
        in: query
        description: 'Receiving audience. Allowed values: everyone , {site-id}'
        schema:
          type: string
          default: everyone
      - name: term
        in: query
        description: Search term
        schema:
          type: string
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
