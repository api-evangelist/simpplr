               \"modifiedAt\": \"2021-09-14T16:15:34.000+0530\",\n                \"message\": \"This is alert message\",\n                \"membersType\": \"site_members\",\n                \"isDismissible\": false,\n                \"displayTo\": \"2021-12-10T11:03:04.000+0530\",\n                \"displayFrom\": \"2021-12-09T11:03:04.000+0530\",\n                \"createdAt\": \"2021-09-14T16:15:34.000+0530\",\n                \"canDelete\": true,\n                \"authoredBy\": {\n                    \"videoCallProvider\": \"zoom\",\n                    \"userId\": \"0055e000006GGxxxxx\",\n                    \"url\": \"https://xxxxx.visualforce.com/apex/app?u=/people/a115e000002Fxxxxx\",\n                    \"peopleId\": \"a115e000002FFxxxxx\",\n                    \"name\": \"Arun Cherian\"\n                },\n                \"alertId\": \"a025e000008Vvxxxxx\"\n            }\n        ]\n    },\n    \"responseTimeStamp\": \"1631617695480\",\n    \"message\": \"\"\n}"
