                  status:
                    type: string
                    example: success
                  result:
                    type: object
                    properties:
                      nextPageToken:
                        type: string
                        example: '1'
                      listOfItems:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: https://xxxx.visualforce.com/apex/app?u=/site/a1A5e000001wJRxxxx/dashboard
                            title:
                              type: string
                              example: Test API Site 11
                            siteId:
                              type: string
                              example: a1A5e000001wJRWxxx
                            peopleCount:
                              type: integer
                              example: 2
                              default: 0
                            name:
                              type: string
                              example: Test API Site 11
                            memberCount:
                              type: integer
                              example: 1
                              default: 0
                            isPublic:
                              type: boolean
                              example: true
                              default: true
                            isPrivate:
                              type: boolean
                              example: false
                              default: true
                            isOwner:
                              type: boolean
                              example: false
                              default: true
                            isMember:
                              type: boolean
                              example: false
                              default: true
                            isManager:
                              type: boolean
                              example: false
                              default: true
                            isListed:
                              type: boolean
                              example: true
                              default: true
                            isInMandatorySubscription:
                              type: boolean
                              example: false
                              default: true
                            isFollower:
                              type: boolean
