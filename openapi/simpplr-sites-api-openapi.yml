openapi: 3.2.0
info:
  title: simpplr-api-gateway Sites API
  version: '1.0'
servers:
- url: https://api.ec.simpplr.com/api
security:
- sec0: []
tags:
- name: Sites
paths:
  /sites:
    post:
      summary: Create a Site
      description: Use this API to create a new Site.
      operationId: create-a-site
      parameters:
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - access
              - landing-page
              - name
              - is-content-submissions-enabled
              - is-question-answer-enabled
              - is-membership-auto-approved
              - category-name
              properties:
                access:
                  type: string
                  description: Access level for this Site
                  default: public
                  enum:
                  - public
                  - private
                  - unlisted
                landing-page:
                  type: string
                  description: Which site page is used as the landing page? (Should be dashboard if the dashboard is enabled)
                  default: dashboard
                  enum:
                  - dashboard
                  - feed
                  - content
                  - files
                  - about
                is-owner:
                  type: boolean
                  description: Is the current user the Owner of this Site?
                  default: false
                has-pages:
                  type: boolean
                  description: Is the Pages feature enabled for this Site?
                  default: true
                name:
                  type: string
                  description: 'Site name (max length : 255)'
                  default: Site created from Developer Portal
                has-events:
                  type: boolean
                  description: Is the Events feature enabled for this Site?
                  default: false
                has-dashboard:
                  type: boolean
                  description: Is the dashboard feature enabled for this Site?
                  default: true
                has-albums:
                  type: boolean
                  description: Is the Albums feature enabled for this Site?
                  default: true
                is-content-submissions-enabled:
                  type: boolean
                  description: Is content submission allowed for this Site?
                  default: true
                is-question-answer-enabled:
                  type: boolean
                  description: Can this Site have a Q&A section
                  default: true
                is-membership-auto-approved:
                  type: boolean
                  default: true
                category-name:
                  type: string
                  description: Name of Category in which user want to create site
                  default: Uncategorized
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": \"success\",\n    \"result\": {\n        \"url\": \"https://xxx.visualforce.com/apex/app?u=/site/a1A5e000001wXnxxx/dashboard\",\n        \"title\": \"Test API Site arun postman\",\n        \"teams\": false,\n        \"storageProvider\": \"intranet\",\n        \"siteId\": \"a1A5e000001wXnhxxx\",\n        \"name\": \"Test API Site arun postman\",\n        \"members\": 1,\n        \"memberCount\": 1,\n        \"managerCount\": 1,\n        \"landingPage\": \"dashboard\",\n        \"isQuestionAnswerEnabled\": true,\n        \"isPrivate\": false,\n        \"isOwner\": true,\n        \"isMembershipAutoApproved\": false,\n        \"isMember\": true,\n        \"isManager\": true,\n        \"isListed\": true,\n        \"isInMandatorySubscription\": false,\n        \"isFollower\": false,\n        \"isFeatured\": false,\n        \"isFavorited\": false,\n        \"isContentSubmissionsEnabled\": true,\n        \"isContentManager\": false,\n        \"isContentFeedEnabled\": true,\n        \"isBroadcast\": false,\n        \"isActive\": true,\n        \"isAccessRequested\": false,\n        \"id\": \"a1A5e000001wXxxx\",\n        \"hasPages\": true,\n        \"hasEvents\": true,\n        \"hasDashboard\": true,\n        \"hasContent\": false,\n        \"hasAlbums\": true,\n        \"followerCount\": 0,\n        \"editUrl\": \"https://xxxx.visualforce.com/apex/app?u=/manage/sites/a1A5e000001wXnhxxx\",\n        \"dashboardLayout\": \"e\",\n        \"createdAt\": \"2021-09-14T21:43:48.000+0530\",\n        \"chatterGroupId\": \"0F95e00000068tGxxx\",\n        \"category\": {\n            \"url\": \"https://xxxx.visualforce.com/apex/app?u=/sites/category?category=a1C5e0000006pbxxx\",\n            \"name\": \"Uncategorized\",\n            \"id\": \"a1C5e0000006pbbExxx\"\n        },\n        \"canMention\": true,\n        \"canEdit\": true,\n        \"canCreatePage\": true,\n        \"canCreateEvent\": true,\n        \"canCreateAlbum\": true,\n        \"canActivateDeactivate\": true,\n        \"analytics\": {\n            \"totalPageCount\": 0,\n            \"totalEventCount\": 0,\n            \"totalAlbumCount\": 0,\n            \"csvUrl\": \"https://xxx.visualforce.com/apex/Reports?action=geSiteContentTypes&SiteId=a1A5e000001wXnxxx\"\n        },\n        \"access\": \"Public\"\n    },\n    \"responseTimeStamp\": \"1631636030166\",\n    \"redirectUrl\": \"https://xxx.visualforce.com/apex/app?u=/site/a1A5e000001wXnxxx/dashboard\",\n    \"message\": \"\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  result:
                    type: object
                    properties:
                      url:
                        type: string
                        example: https://xxx.visualforce.com/apex/app?u=/site/a1A5e000001wXnxxx/dashboard
                      title:
                        type: string
                        example: Test API Site arun postman
                      teams:
                        type: boolean
                        example: false
                        default: true
                      storageProvider:
                        type: string
                        example: intranet
                      siteId:
                        type: string
