  /sites/{site-id}:
    get:
      summary: Get Site by ID
      description: Use this API to get site by ID
      operationId: get-site-by-id
      parameters:
      - name: site-id
        in: path
        description: ID of the Site to search for
        schema:
          type: string
          default: a1A5e000002vUpXEAU
        required: true
      - name: x-user-email
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"statusCode\": 200,\n    \"status\": \"success\",\n    \"message\": \"\",\n    \"data\": {\n        \"url\": \"https://ajay-hada-dev-ed--c.visualforce.com/apex/app?u=/site/a1A5e000002vUpXEAU/dashboard\",\n        \"title\": \"My first site in Simpplr 1253\",\n        \"teams\": false,\n        \"storageProvider\": \"intranet\",\n        \"siteId\": \"a1A5e000002vUpXEAU\",\n        \"name\": \"My first site in Simpplr 1253\",\n        \"members\": 0,\n        \"memberCount\": 1,\n        \"managerCount\": 1,\n        \"landingPage\": \"dashboard\",\n        \"isQuestionAnswerEnabled\": true,\n        \"isPrivate\": false,\n        \"isOwner\": true,\n        \"isMembershipAutoApproved\": false,\n        \"isMember\": true,\n        \"isManager\": true,\n        \"isListed\": true,\n        \"isInMandatorySubscription\": false,\n        \"isFollower\": false,\n        \"isFeatured\": false,\n        \"isFavorited\": false,\n        \"isContentSubmissionsEnabled\": true,\n        \"isContentManager\": false,\n        \"isContentFeedEnabled\": true,\n        \"isBroadcast\": false,\n        \"isActive\": true,\n        \"isAccessRequested\": false,\n        \"id\": \"a1A5e000002vUpXEAU\",\n        \"hasPages\": true,\n        \"hasEvents\": true,\n        \"hasDashboard\": true,\n        \"hasContent\": false,\n        \"hasAlbums\": false,\n        \"followerCount\": 0,\n        \"editUrl\": \"https://ajay-hada-dev-ed--c.visualforce.com/apex/app?u=/manage/sites/a1A5e000002vUpXEAU\",\n        \"dashboardLayout\": \"e\",\n        \"createdAt\": \"2022-03-04T12:00:27.000+0530\",\n        \"chatterGroupId\": \"0F95e0000006BbXCAU\",\n        \"category\": {\n            \"url\": \"https://ajay-hada-dev-ed--c.visualforce.com/apex/app?u=/sites/category?category=a1C5e000001EH2UEAW\",\n            \"name\": \"open\",\n            \"id\": \"a1C5e000001EH2UEAW\"\n        },\n        \"canUploadAllFileTypes\": false,\n        \"canMention\": true,\n        \"canEdit\": true,\n        \"canCreatePage\": true,\n        \"canCreateEvent\": true,\n        \"canCreateAlbum\": false,\n        \"canActivateDeactivate\": true,\n        \"analytics\": {\n            \"totalPageCount\": 0,\n            \"totalEventCount\": 0,\n            \"totalAlbumCount\": 0,\n            \"csvUrl\": \"https://ajay-hada-dev-ed--c.visualforce.com/apex/Reports?action=geSiteContentTypes&SiteId=a1A5e000002vUpXEAU\"\n        },\n        \"access\": \"Public\"\n    }\n}"
              schema:
