                    type: integer
                    example: 200
                    default: 0
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        example: https://ajay-hada-dev-ed--c.visualforce.com/apex/app?u=/site/a1A5e000002vUpXEAU/dashboard
