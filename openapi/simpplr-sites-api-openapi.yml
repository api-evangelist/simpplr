  /sites/activate:
    put:
      summary: Update Site as active
      description: Use this API to update the Site status as active
      operationId: update-site-as-active
      parameters:
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - ids-array
              - make-activated-bool
              properties:
                ids-array:
                  type: array
                  description: List of Site ID's which needs to be activated
                  default:
                  - a1A5e000001wS5AEAU
                  items:
                    type: string
                make-activated-bool:
                  type: boolean
                  default: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": \"success\",\n    \"result\": {\n        \"category\": {\n            \"url\": \"https://ajay-hada-dev-ed--c.visualforce.com/apex/app?u=/sites/category?category=a1C5e0000006pbbEAA\",\n            \"name\": \"Uncategorized\",\n            \"id\": \"a1C5e0000006pbbEAA\"\n        }\n    },\n    \"responseTimeStamp\": \"1631644605120\",\n    \"message\": \"\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  result:
                    type: object
                    properties:
                      category:
                        type: object
                        properties:
                          url:
