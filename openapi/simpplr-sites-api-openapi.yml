                      memberCount:
                        type: integer
                        example: 1
                        default: 0
                      managerCount:
                        type: integer
                        example: 1
                        default: 0
                      landingPage:
                        type: string
                        example: dashboard
                      isQuestionAnswerEnabled:
                        type: boolean
                        example: true
                        default: true
                      isPrivate:
                        type: boolean
                        example: false
                        default: true
                      isOwner:
                        type: boolean
                        example: true
                        default: true
                      isMembershipAutoApproved:
                        type: boolean
                        example: false
                        default: true
                      isMember:
                        type: boolean
                        example: true
                        default: true
                      isManager:
                        type: boolean
                        example: true
                        default: true
                      isListed:
                        type: boolean
                        example: true
                        default: true
                      isInMandatorySubscription:
                        type: boolean
                        example: false
                        default: true
                      isFollower:
                        type: boolean
                        example: false
                        default: true
                      isFeatured:
                        type: boolean
                        example: false
                        default: true
                      isFavorited:
                        type: boolean
                        example: false
                        default: true
                      isContentSubmissionsEnabled:
                        type: boolean
                        example: true
                        default: true
                      isContentManager:
                        type: boolean
                        example: false
                        default: true
                      isContentFeedEnabled:
                        type: boolean
                        example: true
                        default: true
                      isBroadcast:
                        type: boolean
                        example: false
                        default: true
                      isActive:
                        type: boolean
                        example: true
                        default: true
                      isAccessRequested:
                        type: boolean
                        example: false
                        default: true
                      id:
                        type: string
                        example: a1A5e000001wXxxx
                      hasPages:
                        type: boolean
                        example: true
                        default: true
                      hasEvents:
                        type: boolean
                        example: true
                        default: true
                      hasDashboard:
                        type: boolean
                        example: true
                        default: true
                      hasContent:
                        type: boolean
                        example: false
                        default: true
                      hasAlbums:
                        type: boolean
                        example: true
                        default: true
                      followerCount:
                        type: integer
                        example: 0
                        default: 0
                      editUrl:
                        type: string
                        example: https://xxxx.visualforce.com/apex/app?u=/manage/sites/a1A5e000001wXnhxxx
                      dashboardLayout:
                        type: string
                        example: e
                      createdAt:
                        type: string
                        example: 2021-09-14T21:43:48.000+0530
                      chatterGroupId:
                        type: string
                        example: 0F95e00000068tGxxx
                      category:
                        type: object
                        properties:
                          url:
                            type: string
                            example: https://xxxx.visualforce.com/apex/app?u=/sites/category?category=a1C5e0000006pbxxx
                          name:
                            type: string
                            example: Uncategorized
                          id:
                            type: string
                            example: a1C5e0000006pbbExxx
                      canMention:
                        type: boolean
                        example: true
                        default: true
                      canEdit:
                        type: boolean
                        example: true
                        default: true
                      canCreatePage:
                        type: boolean
                        example: true
                        default: true
                      canCreateEvent:
                        type: boolean
                        example: true
                        default: true
                      canCreateAlbum:
                        type: boolean
                        example: true
                        default: true
                      canActivateDeactivate:
                        type: boolean
                        example: true
                        default: true
                      analytics:
                        type: object
                        properties:
                          totalPageCount:
                            type: integer
                            example: 0
                            default: 0
                          totalEventCount:
                            type: integer
                            example: 0
                            default: 0
                          totalAlbumCount:
                            type: integer
                            example: 0
                            default: 0
                          csvUrl:
                            type: string
                            example: https://xxx.visualforce.com/apex/Reports?action=geSiteContentTypes&SiteId=a1A5e000001wXnxxx
                      access:
                        type: string
                        example: Public
                  responseTimeStamp:
                    type: string
                    example: '1631636030166'
                  redirectUrl:
                    type: string
                    example: https://xxx.visualforce.com/apex/app?u=/site/a1A5e000001wXnxxx/dashboard
                  message:
                    type: string
                    example: ''
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": \"error\",\n    \"message\": \"SESSION_TIMEOUT\",\n    \"i18nmessage\": \"SESSION_TIMEOUT\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: SESSION_TIMEOUT
                  i18nmessage:
                    type: string
                    example: SESSION_TIMEOUT
      deprecated: false
      tags:
      - Sites
    get:
      summary: Search for Sites
      description: Use this API to search for Sites
      operationId: search-for-sites
      parameters:
      - name: size
        in: query
        description: Maximum number of results to return
        schema:
          type: integer
          format: int32
          default: 16
      - name: category
        in: query
        description: ID of Category that resulting Sites should belong to
        schema:
          type: string
      - name: filter
        in: query
        description: Filter to apply to results
        schema:
          type: string
          enum:
          - category
          - popular
          - active
          - following
          - member
          - featured
          - contributed
          default: popular
      - name: sort-by
        in: query
        description: Technique for sorting results
        schema:
          type: string
          enum:
          - featured
          - alphabetical
          - createdNewest
          - popular
          - createdOldest
          default: createdNewest
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
