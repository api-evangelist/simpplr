          type: string
          enum:
          - day
          - week
          - month
          default: day
      - name: filter-by
        in: query
        description: Filter to apply to results
        required: true
        schema:
          type: string
          enum:
          - null
          - department
          - location
          default: null
      - name: filter-value
        in: query
        description: Value by which result has to filter.
        schema:
          type: string
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"statusCode\": 200,\n    \"status\": \"success\",\n    \"message\": \"\",\n    \"data\": {\n        \"data\": {\n            \"usersWhoViewedContent\": 1,\n            \"usersLoggedInCount\": 3,\n            \"totalUserCount\": 7,\n            \"totalUniqueUserCount\": 0,\n            \"pageViewCount\": 103,\n            \"mobileLogins\": 0,\n            \"mobileAppLogins\": 0,\n            \"loginsOverTime\": [],\n            \"loggedInPercentage\": 0,\n            \"desktopLogins\": 0,\n            \"contentViewCount\": 32,\n            \"contentPublished\": 130,\n            \"averageLoginsPerUser\": 13,\n            \"averageContentViewsPerUser\": 10.666666666666666\n        },\n        \"csvUrl\": \"https://ajay-hada-dev-ed--c.visualforce.com/apex/Reports?action=getAdoptionData&to=2022-01-26&from=2020-12-27&groupBy=day&filterBy=null&filterValue=null&excludeLoginsOverTime=false&excludeDeviceData=false\"\n    }\n}"
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                    default: 0
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          usersWhoViewedContent:
                            type: integer
                            example: 1
                            default: 0
                          usersLoggedInCount:
                            type: integer
                            example: 3
                            default: 0
                          totalUserCount:
                            type: integer
                            example: 7
                            default: 0
                          totalUniqueUserCount:
                            type: integer
                            example: 0
                            default: 0
                          pageViewCount:
                            type: integer
                            example: 103
                            default: 0
                          mobileLogins:
                            type: integer
                            example: 0
                            default: 0
                          mobileAppLogins:
                            type: integer
                            example: 0
                            default: 0
                          loginsOverTime:
                            type: array
                          loggedInPercentage:
                            type: integer
                            example: 0
                            default: 0
                          desktopLogins:
                            type: integer
                            example: 0
                            default: 0
                          contentViewCount:
                            type: integer
                            example: 32
                            default: 0
                          contentPublished:
                            type: integer
                            example: 130
                            default: 0
                          averageLoginsPerUser:
