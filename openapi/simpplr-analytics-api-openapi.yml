openapi: 3.2.0
info:
  title: Simpplr Analytics API
  version: '1.0'
  description: 'Operations tagged Analytics across 2 of this provider''s published API definitions: simpplr-api-gateway-openapi.yml, simpplr-staging-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.ec.simpplr.com/api
security:
- sec0: []
tags:
- name: Analytics
paths:
