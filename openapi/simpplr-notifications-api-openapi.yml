  /notifications/{notification-id}:
    put:
      summary: Update a Notification
      description: Use this API to update a Notification.
      operationId: update-a-notification
      parameters:
      - name: notification-id
        in: path
        schema:
          type: string
          default: a0O5e000002ShSiEAK
        required: true
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - property-name
              - action-by
              - action-at
              properties:
                property-name:
                  type: string
                  description: How should a user be identified
                  default: email
                  enum:
                  - email
                  - username
                action-by:
                  type: string
                  description: If property-name is email, then the email OR if the property-name is username, then the username of the person who is updating this Notification
                action-at:
                  type: string
                  description: 'Format: YYYY-MM-DDTHH:MM:SS+05:30'
                is-deleted:
                  type: boolean
                  default: false
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": \"success\",\n    \"result\": {},\n    \"responseTimeStamp\": \"1631692147630\",\n    \"message\": \"\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  result:
                    type: object
                    properties: {}
                  responseTimeStamp:
                    type: string
                    example: '1631692147630'
                  message:
                    type: string
                    example: ''
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": \"error\",\n    \"message\": \"SESSION_TIMEOUT\",\n    \"i18nmessage\": \"SESSION_TIMEOUT\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: SESSION_TIMEOUT
                  i18nmessage:
                    type: string
                    example: SESSION_TIMEOUT
      deprecated: false
      tags:
      - Notifications
