openapi: 3.2.0
info:
  title: simpplr-api-gateway Notifications API
  version: '1.0'
servers:
- url: https://api.ec.simpplr.com/api
security:
- sec0: []
tags:
- name: Notifications
paths:
  /notifications:
    post:
      summary: Create a Notification
      description: Use this API to create a Notification.
      operationId: create-a-notification
      parameters:
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - property-name
              - sent-to
              - sent-by
              - url
              - comment
              properties:
                property-name:
                  type: string
                  description: How should a user be identified
                  default: email
                  enum:
                  - email
                  - username
                sent-to:
                  type: string
                  description: If property-name is email, then the email OR if the property-name is username, then the username of the person to send this Notification to
                sent-by:
                  type: string
                  description: If property-name is email, then the email OR if the property-name is username, then the username of the person to send this Notification to
                url:
                  type: string
                  description: Target URL for the Notification
                  default: https://test.com
                notification-type:
                  type: string
                  description: Actionable - Notifications which require some action, like a follow request , leave approval.   Information - Notification which publishes some information
                  default: Actionable
                  enum:
                  - Actionable
                  - Information
                comment:
                  type: string
                  description: Possible literals - {{fullName}}
                  default: '{{fullName}} has submitted leave request for approval'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": \"success\",\n    \"result\": {\n        \"notificationId\": \"a0O5e000002ShSiEAK\"\n    },\n    \"responseTimeStamp\": \"1631691906937\",\n    \"message\": \"\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  result:
                    type: object
                    properties:
                      notificationId:
                        type: string
                        example: a0O5e000002ShSiEAK
                  responseTimeStamp:
                    type: string
                    example: '1631691906937'
                  message:
                    type: string
                    example: ''
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": \"error\",\n    \"message\": \"SESSION_TIMEOUT\",\n    \"i18nmessage\": \"SESSION_TIMEOUT\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: SESSION_TIMEOUT
                  i18nmessage:
                    type: string
                    example: SESSION_TIMEOUT
      deprecated: false
      tags:
      - Notifications
    get:
      summary: Search for Notifications
      description: Use this API to search for Notifications.
      operationId: search-for-notifications
      parameters:
      - name: since
        in: query
        description: Time Stamp
        schema:
          type: string
          default: '1608021029402'
      - name: size
        in: query
        description: Page size
        schema:
          type: string
          default: '1'
      - name: include-actioned
        in: query
        description: Should actioned Notifications be included
        required: true
        schema:
          type: boolean
          default: true
      - name: filter
        in: query
        description: Filter to apply to results
        schema:
          type: string
          enum:
          - activity
          - actionable
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
          type: string
