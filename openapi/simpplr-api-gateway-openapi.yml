              examples:
                Result:
                  value: "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n\t<meta charset=\"utf-8\">\n\t<title>Error</title>\n</head>\n\n<body>\n\t<pre>Cannot GET /alertsssss</pre>\n</body>\n\n</html>"
      deprecated: false
  /alerts/{alert-id}:
    put:
      summary: Update an Alert
      description: Use this API to update an Alert.
      operationId: update-an-alert
      parameters:
      - name: alert-id
        in: path
        description: ID of the Alert to be updated
        schema:
          type: string
          default: a025e000008VvrlAAC
        required: true
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              - is-dismissible
              - has-url
              - recipient
              properties:
                message:
                  type: string
                  description: Alert message
                  default: This is an updated Alert message
                site-id:
                  type: string
                  description: ID of the Site
                  default: a194W000009TBFdQAO
                is-dismissible:
                  type: boolean
                  description: 'true: The Alert can be dismissed by users.   false: The Alert cannot be dismissed by users.'
                  default: false
                has-url:
                  type: boolean
                  description: Will this Alert have a hyperlink to redirect the users to a particular page
                  default: false
                url:
                  type: string
                  description: Target link for the Alert (REQUIRED if has-url is true)
                recipient:
                  type: string
                  description: Recipient group for this Alert
                  default: site
                  enum:
                  - everyone
                  - audience
                  - site
                  - segment
                audience-id:
                  type: string
                  description: Audience ID. REQUIRED if recipient is set as audience
                display-to:
                  type: string
                  description: 'Alert display End Date Time -: YYYY-MM-DDTH:mm:ss+05:30'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": \"success\",\n    \"result\": {\n        \"attributes\": {\n            \"type\": \"Alert__c\",\n            \"url\": \"/services/data/v52.0/sobjects/Alert__c/a025e000008Vvxxxxx\"\n        },\n        \"Id\": \"a025e000008Vvxxxxx\",\n        \"Members_Type__c\": null,\n        \"Alert_Message__c\": \"test updated123@\",\n        \"Alert_Url__c\": null,\n        \"Author__c\": \"a115e000002FFxxxxx\",\n        \"Display_From_DateTime__c\": \"2021-09-14T13:19:08.319+0000\",\n        \"Display_To_DateTime__c\": null,\n        \"Is_Dismissible__c\": true,\n        \"Is_Link_Alert__c\": false,\n        \"Recipient__c\": \"site\",\n        \"Recipient_Site__c\": null,\n        \"Audience__c\": null,\n        \"Recipient_Count__c\": 6\n    },\n    \"responseTimeStamp\": \"1631625548559\",\n    \"message\": \"\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  result:
                    type: object
                    properties:
                      attributes:
                        type: object
                        properties:
                          type:
                            type: string
                            example: Alert__c
                          url:
                            type: string
                            example: /services/data/v52.0/sobjects/Alert__c/a025e000008Vvxxxxx
                      Id:
                        type: string
                        example: a025e000008Vvxxxxx
                      Members_Type__c: {}
                      Alert_Message__c:
                        type: string
                        example: test updated123@
                      Alert_Url__c: {}
                      Author__c:
                        type: string
                        example: a115e000002FFxxxxx
                      Display_From_DateTime__c:
                        type: string
                        example: 2021-09-14T13:19:08.319+0000
                      Display_To_DateTime__c: {}
                      Is_Dismissible__c:
                        type: boolean
                        example: true
                        default: true
                      Is_Link_Alert__c:
                        type: boolean
                        example: false
                        default: true
                      Recipient__c:
                        type: string
                        example: site
                      Recipient_Site__c: {}
                      Audience__c: {}
                      Recipient_Count__c:
                        type: integer
                        example: 6
                        default: 0
                  responseTimeStamp:
                    type: string
                    example: '1631625548559'
                  message:
                    type: string
                    example: ''
        '400':
          description: '400'
          content:
            text/plain:
              examples:
                Result:
                  value: "{\n    \"statusCode\": 400,\n    \"status\": \"error\",\n    \"message\": \"\",\n    \"data\": {}\n}"
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 400
                    default: 0
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties: {}
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": \"error\",\n    \"message\": \"SESSION_TIMEOUT\",\n    \"i18nmessage\": \"SESSION_TIMEOUT\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: SESSION_TIMEOUT
                  i18nmessage:
                    type: string
                    example: SESSION_TIMEOUT
        '404':
          description: '404'
          content:
            text/plain:
              examples:
