                      canDelete:
                        type: boolean
                        example: false
                        default: true
                      authoredBy:
                        type: object
                        properties:
                          videoCallProvider:
                            type: string
                            example: zoom
                          userId:
                            type: string
                            example: 0055e000006GGxxxxx
                          url:
                            type: string
                            example: https://xxxxxxx.visualforce.com/apex/app?u=/people/a115e000002FFncAAG
                          peopleId:
                            type: string
                            example: a115e000002FFncAAG
                          name:
                            type: string
                            example: Arun Cherian
                      alertId:
                        type: string
                        example: a025e000008Vxxxxx
                  responseTimeStamp:
                    type: string
                    example: '1631621234526'
                  message:
                    type: string
                    example: ''
        '400':
          description: '400'
          content:
            text/plain:
              examples:
                Result:
                  value: "{\n    \"statusCode\": 400,\n    \"status\": \"error\",\n    \"message\": \"\",\n    \"data\": {}\n}"
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 400
                    default: 0
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties: {}
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": \"error\",\n    \"message\": \"SESSION_TIMEOUT\",\n    \"i18nmessage\": \"SESSION_TIMEOUT\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: SESSION_TIMEOUT
                  i18nmessage:
                    type: string
                    example: SESSION_TIMEOUT
      deprecated: false
  /analytics/adoption:
    get:
      summary: App Adoption Data
      description: Use this API to get App Adoption Data
      operationId: app-adoption
      parameters:
      - name: from
        in: query
        description: Time from which the App Adoption Data need to be selected
        required: true
        schema:
          type: string
          default: '2020-12-27'
      - name: to
        in: query
        description: Time till which the App Adoption Data need to be selected
        required: true
        schema:
          type: string
          default: '2022-01-26'
      - name: group-by
        in: query
        description: Group the Result according to group-by value
        schema:
          type: string
          enum:
          - day
          - week
          - month
          default: day
      - name: filter-by
        in: query
        description: Filter to apply to results
        required: true
        schema:
          type: string
          enum:
          - null
          - department
          - location
          default: null
      - name: filter-value
        in: query
        description: Value by which result has to filter.
        schema:
          type: string
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
