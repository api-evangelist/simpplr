                type: object
                properties:
                  status:
                    type: string
                    example: success
                  result:
                    type: object
                    properties:
                      status:
                        type: string
                        example: expired
                      seenCount:
                        type: integer
                        example: 0
                        default: 0
                      recipientCount:
                        type: integer
                        example: 5
                        default: 0
                      recipient:
                        type: string
                        example: everyone
                      modifiedAt:
                        type: string
                        example: 2021-09-14T17:37:07.000+0530
                      message:
                        type: string
