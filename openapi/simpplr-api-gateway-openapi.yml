  /contents/page-categories:
    post:
      summary: Search for Page Categories
      description: This search API is used to retrieve all page categories based on the specified 'site-id' and 'sort- by' (either 'createdNewest' or 'createdOldest') provided in the request body. Additionally, we have an additional parameter, 'term' which contains the name of the page category
      operationId: search-page-categories
      parameters:
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                size:
                  type: integer
                  description: Maximum number of results to return
                  default: 16
                  format: int32
                sort-by:
                  type: string
                  description: Technique to sort the results by
                  default: createdNewest
                  enum:
                  - createdNewest
                  - createdOldest
                site-id:
                  type: string
                  description: ID of a Site that resulting Content must belong to
                  default: a1A5e000001wQdXEAU
                term:
