    delete:
      summary: Delete an Alert
      description: Use this API to delete an Alert.
      operationId: delete-an-alert
      parameters:
      - name: alert-id
        in: path
        description: ID of the alert to be deleted.
        schema:
          type: string
          default: a025e000008VvymAAC
        required: true
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
