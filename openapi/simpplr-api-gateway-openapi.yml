                  value: "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n\t<meta charset=\"utf-8\">\n\t<title>Error</title>\n</head>\n\n<body>\n\t<pre>Cannot PUT /alerts/</pre>\n</body>\n\n</html>"
