      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": \"success\",\n    \"result\": {\n        \"attributes\": {\n            \"type\": \"Alert__c\",\n            \"url\": \"/services/data/v52.0/sobjects/Alert__c/a025e000008Vxxxxx\"\n        },\n        \"Id\": \"a025e000008Vxxxxx\",\n        \"Is_Deleted__c\": true\n    },\n    \"responseTimeStamp\": \"1631623863578\",\n    \"message\": \"\"\n}"
