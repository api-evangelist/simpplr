  /contents/site/{site-id}/event/{content-id}:
    put:
      summary: Update an Event
      description: Use this API to update an Event.
      operationId: update-an-event
      parameters:
      - name: site-id
        in: path
        description: ID of the Site under which the Page has to be created
        schema:
          type: string
          default: a1A5e000001wQdXEAU
        required: true
      - name: content-id
        in: path
        description: ID of the Page to be updated
        schema:
          type: string
          default: a185e000000FQXgAAO
        required: true
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - publish-at
              - starts-at
              - ends-at
              - timezone-iso
              - location
              - authored-by
              - has-rsvp
              properties:
                publish-at:
                  type: string
                  description: Date time at which this Event should be published
                  default: '2022-02-12T00:00:00+05:30'
                body:
                  type: string
                  description: Content body for this Event
                  default: <p>This is the basic description text.</p>
                summary:
                  type: string
                  description: The summary of this Event
                  default: This is custom summary text.
                title:
                  type: string
                  description: URL for the Event
                  default: Page created from API Portal
                is-feed-enabled:
                  type: boolean
                  description: Is feed enabled for this Event?
                  default: true
                site-id:
                  type: string
                  description: ID of the Site under which the Event should be published
                  default: a1A5e000001wQdXEAU
                img:
                  type: string
                  description: Thumbnail image for this Event
                  default: 'null'
                starts-at:
                  type: string
                  description: Date time at which the Event should start
                  default: '2022-03-05T00:00:00+05:30'
                is-all-day:
                  type: boolean
                  description: Should the Event be running all day?
                  default: true
                publishing-status:
                  type: string
                  description: Publishing the Content
                  default: immediate
                  enum:
                  - immediate
                  - schedule
                publish-to:
                  type: string
                  description: Date time till which the Event should be published
                  default: 'null'
                ends-at:
                  type: string
                  description: Date time at which the Event should end
                  default: '2022-12-17T23:59:59+05:30'
                timezone-iso:
                  type: string
                  description: Date Time Zone(ISO)
                  default: Asia/Kolkata
                directions:
                  type: array
                  description: List of Instructions that lead to the Event Location
                  items:
                    type: string
                location:
                  type: string
                  description: The location for this Event
                  default: Delhi
                language:
                  type: string
                  default: en
                list-of-topics:
                  type: array
                  description: List of Topics for this Event
                  items:
                    type: string
                authored-by:
                  type: string
                  description: People id of the one user wants to transfer authorship of Blog
                  default: a115e000002CMg7AAG
                has-rsvp:
                  type: boolean
                  description: Enables capacity-count for the Event
                  default: true
