                      Id:
                        type: string
                        example: a025e000008Vxxxxx
                      Is_Deleted__c:
                        type: boolean
                        example: true
                        default: true
                  responseTimeStamp:
                    type: string
                    example: '1631623863578'
                  message:
                    type: string
                    example: ''
        '400':
          description: '400'
          content:
            text/plain:
              examples:
                Result:
                  value: "{\n    \"statusCode\": 400,\n    \"status\": \"error\",\n    \"message\": \"\",\n    \"data\": {}\n}"
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 400
                    default: 0
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties: {}
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": \"error\",\n    \"message\": \"SESSION_TIMEOUT\",\n    \"i18nmessage\": \"SESSION_TIMEOUT\"\n}"
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: SESSION_TIMEOUT
                  i18nmessage:
                    type: string
                    example: SESSION_TIMEOUT
        '404':
          description: '404'
          content:
            text/plain:
              examples:
                Result:
                  value: "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n\t<meta charset=\"utf-8\">\n\t<title>Error</title>\n</head>\n\n<body>\n\t<pre>Cannot DELETE /alerts/</pre>\n</body>\n\n</html>"
