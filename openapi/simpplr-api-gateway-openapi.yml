        in: path
        schema:
          type: string
          default: a025e000008VvrlAAC
        required: true
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"status\": \"success\",\n    \"result\": {\n        \"status\": \"expired\",\n        \"seenCount\": 0,\n        \"recipientCount\": 5,\n        \"recipient\": \"everyone\",\n        \"modifiedAt\": \"2021-09-14T17:37:07.000+0530\",\n        \"message\": \"Updated alert message!\",\n        \"membersType\": \"site_members\",\n        \"isDismissible\": true,\n        \"displayTo\": \"2021-12-10T11:03:04.000+0530\",\n        \"displayFrom\": \"2021-09-14T17:27:48.000+0530\",\n        \"createdAt\": \"2021-09-14T11:51:22.000+0530\",\n        \"canDelete\": false,\n        \"authoredBy\": {\n            \"videoCallProvider\": \"zoom\",\n            \"userId\": \"0055e000006GGxxxxx\",\n            \"url\": \"https://xxxxxxx.visualforce.com/apex/app?u=/people/a115e000002FFncAAG\",\n            \"peopleId\": \"a115e000002FFncAAG\",\n            \"name\": \"Arun Cherian\"\n        },\n        \"alertId\": \"a025e000008Vxxxxx\"\n    },\n    \"responseTimeStamp\"\
                    : \"1631621234526\",\n    \"message\": \"\"\n}"
