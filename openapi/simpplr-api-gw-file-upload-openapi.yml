paths:
  /contents/site/{site-id}/page:
    post:
      summary: Create a Page
      description: Use this API to create a new Page
      operationId: create-page
      parameters:
      - name: site-id
        in: path
        description: ID of the Site under which this Page has to be created
        schema:
          type: string
          default: a1A5e000001wQdXEAU
        required: true
      - name: x-user-email
        in: header
        description: User's email to login into Salesforce
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - content-sub-type
              - body
              - title
              - category-name
              - publishing-status
              properties:
                content-sub-type:
                  type: string
                  default: news
                  enum:
                  - news
                  - knowledge
                publish-at:
                  type: string
                  description: Date time at which this Content should be published
                  default: '2022-02-12T00:00:00+05:30'
                body:
                  type: string
                  description: Content body
                  default: <p>This is the basic description text.</p>
                summary:
                  type: string
                  description: The summary of the Content
                  default: This is a custom summary text.
                title:
                  type: string
                  description: Title for this Content
                  default: Page created from API Portal
                is-feed-enabled:
                  type: boolean
                  description: Is feed enabled for this Content?
                  default: true
                category-name:
                  type: string
                  description: The category assigned to this content ( Only applies to Pages )
                  default: News
                publishing-status:
                  type: string
                  description: When should this Page be published
                  default: immediate
                  enum:
                  - immediate
                  - schedule
      responses:
        '200':
          description: '200'
          content:
