                    \      \"isActive\": true,\n            \"chatterGroupId\": \"0F95e00000068XECAY\",\n            \"access\": \"Public\"\n        },\n        \"recentViewCount\": 0,\n        \"publishAt\": \"2020-02-12T00:00:00.000+0530\",\n        \"postCount\": 0,\n        \"modifiedAt\": \"2021-09-14T23:16:03.000+0530\",\n        \"listOfTopics\": [],\n        \"listOfTopAlbumImages\": [],\n        \"listOfInlineVideos\": [],\n        \"listOfInlineImages\": [],\n        \"listOfFiles\": [],\n        \"likeCount\": 0,\n        \"lastModifiedDateTimeStamp\": 1631641563000,\n        \"isScheduled\": false,\n        \"isPublished\": true,\n        \"isOpenToNotification\": true,\n        \"isMustRead\": false,\n        \"isMaximumWidth\": false,\n        \"isLiked\": false,\n        \"isLatest\": true,\n        \"isInSiteCarousel\": false,\n        \"isInHomeCarousel\": false,\n        \"isFeedEnabled\": true,\n        \"isFavorited\": false,\n        \"id\": \"a185e000000FQWOAA4\",\n\
